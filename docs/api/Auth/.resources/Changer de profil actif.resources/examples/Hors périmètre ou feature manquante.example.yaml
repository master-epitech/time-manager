$kind: http-example
request:
  url: "{{base_url}}/auth/active-profile"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "profileCode": "MANAGER"
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "VALIDATION_ERROR",
          "message": "string",
          "details": [
            {
              "field": "string",
              "message": "string"
            },
            {
              "field": "string",
              "message": "string"
            }
          ]
        },
        "requestId": "d3fd3af2-385e-c8e7-4e10-d161bcbc8291"
      }
order: 3000
