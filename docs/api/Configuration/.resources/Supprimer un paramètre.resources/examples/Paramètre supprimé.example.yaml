$kind: http-example
request:
  url: "{{base_url}}/config/:config_key"
  method: DELETE
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: config_key
      value: CLOCK_MIN_GAP_SEC
      disabled: false
      description: "(Required) "
  body:
    type: text
    content: ""
response:
  statusCode: 204
  statusText: No Content
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 1000
