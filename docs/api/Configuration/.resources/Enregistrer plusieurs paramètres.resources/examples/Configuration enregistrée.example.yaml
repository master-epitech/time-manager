$kind: http-example
request:
  url: "{{base_url}}/config"
  method: PUT
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "items": [
          {
            "configKey": "string",
            "value": "string",
            "module": "string",
            "description": "string"
          }
        ]
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": [
          {
            "configKey": "string",
            "value": "string",
            "module": "string",
            "description": "string"
          },
          {
            "configKey": "string",
            "value": "string",
            "module": "string",
            "description": "string"
          }
        ]
      }
order: 1000
