$kind: http-example
request:
  url: "{{base_url}}/config/:config_key"
  method: PUT
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: config_key
      value: CLOCK_MIN_GAP_SEC
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "value": "string",
        "module": "string",
        "description": "string"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "VALIDATION_ERROR",
          "message": "string",
          "details": [
            {
              "field": "string",
              "message": "string"
            },
            {
              "field": "string",
              "message": "string"
            }
          ]
        },
        "requestId": "d3fd3af2-385e-c8e7-4e10-d161bcbc8291"
      }
order: 2000
