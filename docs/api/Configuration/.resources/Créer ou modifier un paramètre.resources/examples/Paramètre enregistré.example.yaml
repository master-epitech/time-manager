$kind: http-example
request:
  url: "{{base_url}}/config/:config_key"
  method: PUT
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: config_key
      value: CLOCK_MIN_GAP_SEC
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "value": "string",
        "module": "string",
        "description": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "configKey": "string",
        "value": "string",
        "module": "string",
        "description": "string"
      }
order: 1000
