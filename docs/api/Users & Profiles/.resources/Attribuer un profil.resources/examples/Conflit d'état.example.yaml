$kind: http-example
request:
  url: "{{base_url}}/users/:user_id/profiles"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: user_id
      value: c5f95c86-ef19-f8c3-8bd8-3cf0f41860e8
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "profileCode": "MANAGER",
        "startDate": "2020-07-30",
        "endDate": "2015-12-11",
        "reason": "string",
        "orderPriority": 1
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "VALIDATION_ERROR",
          "message": "string",
          "details": [
            {
              "field": "string",
              "message": "string"
            },
            {
              "field": "string",
              "message": "string"
            }
          ]
        },
        "requestId": "d3fd3af2-385e-c8e7-4e10-d161bcbc8291"
      }
order: 3000
