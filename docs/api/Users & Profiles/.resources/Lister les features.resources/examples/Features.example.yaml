$kind: http-example
request:
  url: "{{base_url}}/features"
  method: GET
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": [
          {
            "code": "string",
            "label": "string",
            "scope": "NONE",
            "module": "string"
          },
          {
            "code": "string",
            "label": "string",
            "scope": "ALL",
            "module": "string"
          }
        ]
      }
order: 1000
