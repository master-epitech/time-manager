$kind: http-example
request:
  url: "{{base_url}}/profiles/:profile_code/features"
  method: PUT
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: profile_code
      value: MANAGER
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "features": [
          "string",
          "string"
        ]
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 1000
