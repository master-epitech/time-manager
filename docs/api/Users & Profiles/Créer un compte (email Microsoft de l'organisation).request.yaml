$kind: http-request
description: |
  Valide le domaine de l'email contre `organisation.emailDomain`.
  Si `authProvider=MICROSOFT` et `sendMicrosoftInvitation=true`, envoie
  l'invitation Microsoft 365 ; l'OID sera stocké à l'acceptation.
  Si `microsoftOid` est fourni, le compte est lié directement.
url: "{{base_url}}/users"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "firstName": "string",
      "lastName": "string",
      "email": "prenom.nom@trinity-market.example",
      "profileCode": "EMPLOYEE",
      "departmentId": "8c8a8d0b-f9ab-fcd5-d1c0-0417154c73de",
      "authProvider": "MICROSOFT",
      "sendMicrosoftInvitation": true,
      "microsoftOid": "string",
      "phone": "string",
      "teamId": "726da361-4e4d-5523-fd72-a1f6ef4586ee",
      "jobTitle": "string",
      "contractType": "CDD",
      "hireDate": "1984-10-27",
      "matricule": "string"
    }
settings: {}
examples: ./.resources/Créer un compte (email Microsoft de l'organisation).resources/examples
order: 2000
