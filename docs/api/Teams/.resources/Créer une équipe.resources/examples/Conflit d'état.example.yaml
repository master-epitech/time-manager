$kind: http-example
request:
  url: "{{base_url}}/teams"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "departmentId": "4b108d4d-2d19-5982-ed2d-9b75fe837fe0",
        "code": "IT-PLAT",
        "name": "IT — Plateforme"
      }
