$kind: http-example
request:
  url: "{{base_url}}/absence-types/:type_id"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: type_id
      value: "1862"
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "label": "string",
        "hasCounter": true
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": 5158,
        "code": "string",
        "label": "string",
        "hasCounter": true
      }
order: 1000
