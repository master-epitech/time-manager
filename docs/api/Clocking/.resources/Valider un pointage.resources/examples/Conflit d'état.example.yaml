$kind: http-example
request:
  url: "{{base_url}}/clock-events/:event_id/validate"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: event_id
      value: c5f95c86-ef19-f8c3-8bd8-3cf0f41860e8
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "note": "string"
      }
