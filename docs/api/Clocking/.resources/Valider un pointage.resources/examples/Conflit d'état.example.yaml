  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "VALIDATION_ERROR",
          "message": "string",
          "details": [
            {
              "field": "string",
              "message": "string"
            },
            {
              "field": "string",
              "message": "string"
            }
          ]
        },
        "requestId": "d3fd3af2-385e-c8e7-4e10-d161bcbc8291"
      }
order: 2000
